name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # server.test.ts exercises the SPA fallback, which serves dist/index.html.
      - run: bun run --bun build
      - run: bun run --bun test --run
      - run: bun run --bun type-check
      - run: bun run --bun lint
